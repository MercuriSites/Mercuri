<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Páginas web - Mercuri</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg: #dadada;
      --text: #1c1f26;
      --muted: #1f1f1f;
      --accent: #1f1f1f;
      --surface: #838383;
      --max: 1000px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Cabecera */
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid #1f1f1f;
    }
    .nav {
      max-width: var(--max); margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.6rem; margin-left: 24px; }
    .logo img { width: 48px; height: 48px; display: block; }
    .menu { display: flex; gap: 24px; list-style: none; }
    .menu a:hover { color: var(--accent); }
    .menu-btn {
      display: none; background: none; border: 1px solid #1f1f1f;
      border-radius: 6px; padding: 6px 12px; font-size: 1rem; cursor: pointer;
    }

    /* Secciones */
    section { max-width: var(--max); margin: 0 auto; padding: 72px 20px; text-align: center; }
    .hero h1 { font-size: clamp(2.8rem, 8vw, 5.5rem); line-height: 1.15; max-width: 16ch; margin: 0; }
    .hero-title { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .hero-logo { width: clamp(90px, 16vw, 190px); height: auto; display: block; }
    .hero p { margin: 18px auto 28px; color: var(--muted); max-width: 52ch; }
    .btn {
      display: inline-block; background: var(--accent); color: #fff;
      padding: 12px 22px; border-radius: 8px; font-weight: 600; border: 0; cursor: pointer;
    }
    .btn:hover { filter: brightness(1.1); }

    h2 { font-size: 1.7rem; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .box { background: var(--surface); padding: 22px; border-radius: 10px; }
    .box h3 { margin-bottom: 6px; }
    .box-link { display: flex; align-items: center; justify-content: center; transition: transform .15s, filter .15s; cursor: pointer; }
    .box-link h3 { margin: 0; font-size: 1.15rem; }
    .box-link:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .box p { color: var(--muted); }

    .contact { list-style: none; margin-top: 12px; }
    .contact li { margin-bottom: 6px; }
    .contact a { color: var(--accent); font-weight: 600; }
    .contact a:hover { text-decoration: underline; }

    footer { text-align: center; padding: 28px 20px; color: var(--muted); border-top: 1px solid #1f1f1f; }

    /* Móvil */
    @media (max-width: 640px) {
      .menu-btn { display: block; }
      .menu {
        display: none; position: absolute; top: 100%; left: 0; right: 0;
        flex-direction: column; gap: 0; background: var(--bg);
        border-bottom: 1px solid #1f1f1f;
      }
      .menu.open { display: flex; }
      .menu a { display: block; padding: 14px 20px; }
    }
    /* Ajustes de esta página */
    .hero h1 { margin: 0 auto; }
    @media (max-width: 640px) {
      .menu { display: flex; position: static; flex-direction: row; background: none; border: 0; }
      .menu a { padding: 0; }
    }

    /* Formulario (Tally) */
    #formulario { padding-top: 32px; }
    .form-wrap {
      background: var(--surface); border-radius: 10px;
      padding: 16px; margin-top: 20px; text-align: left;
    }
    .form-wrap iframe { display: block; width: 100%; min-height: 500px; border: 0; }
    .form-placeholder {
      padding: 48px 20px; text-align: center; color: var(--muted);
      border: 2px dashed #1f1f1f; border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <nav class="nav">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="">
        <span>Mercuri</span>
      </a>
      <ul class="menu" id="menu">
        <li><a href="index.html">Volver al inicio</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Páginas web</h1>
      <p>Aquí irá el contenido de esta sección.</p>
      <a href="#formulario" class="btn">Pedir información</a>
    </section>

    <section id="formulario">
      <h2>Cuéntanos tu proyecto</h2>
      <p>Rellena el formulario y te responderemos lo antes posible.</p>

      <div class="form-wrap">

        <!-- ============================================================
             FORMULARIO DE TALLY
             1) Borra el <div class="form-placeholder"> de abajo.
             2) Quita los comentarios del <iframe> y cambia
                REEMPLAZAR_ID por el ID del formulario
                (la parte final de https://tally.so/r/XXXXXX).
             3) Quita los comentarios del <script> del final de la página.
             ============================================================ -->

        <div class="form-placeholder">
          <p>El formulario estará disponible próximamente.</p>
        </div>

        <!--
        <iframe
          data-tally-src="https://tally.so/embed/REEMPLAZAR_ID?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
          loading="lazy"
          width="100%"
          height="500"
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          title="Formulario de contacto - Páginas web">
        </iframe>
        -->

      </div>
    </section>
  </main>

  <footer>© <span id="year"></span> Mercuri</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <!-- Script de Tally: descomentar cuando pongas el iframe -->
  <!-- <script async src="https://tally.so/widgets/embed.js"></script> -->
</body>
</html>
